<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Astriena</title>
  <desc id="desc">Original five-star asterism: a slightly irregular A of linked stars on a night sky. Not a catalogued constellation.</desc>
  <defs>
    <radialGradient id="sky" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#1A2740"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- Distant field stars (unlinked) -->
  <circle cx="10" cy="16" r="0.55" fill="#5C6B84"/>
  <circle cx="56" cy="12" r="0.45" fill="#5C6B84"/>
  <circle cx="58" cy="42" r="0.5" fill="#5C6B84"/>
  <circle cx="22" cy="58" r="0.4" fill="#5C6B84"/>
  <circle cx="40" cy="7" r="0.45" fill="#5C6B84"/>
  <!-- Asterism lines -->
  <g fill="none" stroke="#C4B48A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 11 L19 26 L15 50"/>
    <path d="M32 11 L45 24 L50 51"/>
    <path d="M19 26 L45 24"/>
  </g>
  <g fill="#E8D5A3">
    <circle cx="32" cy="11" r="2.15"/>
    <circle cx="19" cy="26" r="1.65"/>
    <circle cx="45" cy="24" r="1.65"/>
    <circle cx="15" cy="50" r="1.45"/>
    <circle cx="50" cy="51" r="1.45"/>
  </g>
  <g fill="#F7F1E1">
    <circle cx="32" cy="11" r="0.7"/>
    <circle cx="19" cy="26" r="0.5"/>
    <circle cx="45" cy="24" r="0.5"/>
    <circle cx="15" cy="50" r="0.4"/>
    <circle cx="50" cy="51" r="0.4"/>
  </g>
</svg>
