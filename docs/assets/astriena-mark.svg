<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Astriena</title>
  <desc id="desc">A custom pale-gold display A over an irregular field of stars on a deep night sky.</desc>
  <defs>
    <radialGradient id="sky" cx="34%" cy="27%" r="82%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- Distant, unlinked stars establish sky depth. -->
  <g fill="#5C6B84">
    <circle cx="6" cy="9" r=".28"/><circle cx="14" cy="6" r=".38"/>
    <circle cx="25" cy="8" r=".24"/><circle cx="36" cy="5" r=".31"/>
    <circle cx="49" cy="7" r=".25"/><circle cx="58" cy="12" r=".36"/>
    <circle cx="4" cy="26" r=".23"/><circle cx="8" cy="39" r=".34"/>
    <circle cx="5" cy="51" r=".25"/><circle cx="13" cy="58" r=".30"/>
    <circle cx="29" cy="58" r=".24"/><circle cx="41" cy="60" r=".33"/>
    <circle cx="55" cy="56" r=".27"/><circle cx="60" cy="45" r=".35"/>
    <circle cx="58" cy="35" r=".22"/><circle cx="61" cy="22" r=".29"/>
    <circle cx="12" cy="27" r=".22"/><circle cx="22" cy="28" r=".30"/>
    <circle cx="34" cy="27" r=".21"/><circle cx="47" cy="20" r=".24"/>
    <circle cx="50" cy="38" r=".32"/><circle cx="44" cy="50" r=".22"/>
    <circle cx="31" cy="51" r=".27"/><circle cx="11" cy="46" r=".20"/>
    <circle cx="27" cy="14" r=".19"/><circle cx="39" cy="38" r=".24"/>
    <circle cx="54" cy="15" r=".18"/><circle cx="35" cy="56" r=".18"/>
  </g>

  <!-- Mixed-magnitude foreground stars, independent of the letterform. -->
  <g fill="#E8D5A3">
    <circle cx="18" cy="16" r=".88"/><circle cx="39" cy="31" r=".74"/>
    <circle cx="25" cy="45" r=".68"/><circle cx="54" cy="27" r=".62"/>
    <circle cx="43" cy="12" r=".56"/><circle cx="14" cy="34" r=".51"/>
    <circle cx="31" cy="19" r=".46"/><circle cx="18" cy="54" r=".43"/>
    <circle cx="9" cy="21" r=".39"/><circle cx="48" cy="46" r=".36"/>
    <circle cx="34" cy="42" r=".33"/><circle cx="52" cy="16" r=".30"/>
  </g>
  <g fill="#F7F1E1">
    <circle cx="18" cy="16" r=".27"/><circle cx="39" cy="31" r=".22"/>
    <circle cx="25" cy="45" r=".19"/><circle cx="54" cy="27" r=".17"/>
  </g>

  <!-- Custom display A: flared feet, tapered stems, and a bowed crossbar. -->
  <g fill="#E8D5A3">
    <path d="M30.2 8.5 Q31.6 6.5 33.1 8.8 L24 52 H14.2 Q18.8 50.2 20.4 48.3 L28.6 11 Q29.3 9.1 30.2 8.5Z"/>
    <path d="M31.2 9.2 Q32.7 6.6 34.5 10.2 L48 48.5 Q49.2 50.5 52.2 52 H42.5 L30.3 11.2 Q30.5 9.9 31.2 9.2Z"/>
    <path d="M22.2 35.4 Q31.8 33.5 41.7 35.1 L43.4 40 Q32.1 38.2 20.6 40.2Z"/>
  </g>
  <path d="M31.1 10.2 Q32 8.4 33 10.1 L20.1 49.1"
        fill="none" stroke="#F7F1E1" stroke-width=".45" stroke-opacity=".20"
        stroke-linecap="round"/>
</svg>
