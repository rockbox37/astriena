<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Astriena</title>
  <desc id="desc">An original irregular field of stars with faint chart connections and an almost transparent circular frame on a deep night sky.</desc>
  <defs>
    <radialGradient id="sky" cx="34%" cy="27%" r="82%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- Distant, unlinked stars establish sky depth. -->
  <g fill="#5C6B84">
    <circle cx="6" cy="9" r=".28"/><circle cx="14" cy="6" r=".38"/>
    <circle cx="25" cy="8" r=".24"/><circle cx="36" cy="5" r=".31"/>
    <circle cx="49" cy="7" r=".25"/><circle cx="58" cy="12" r=".36"/>
    <circle cx="4" cy="26" r=".23"/><circle cx="8" cy="39" r=".34"/>
    <circle cx="5" cy="51" r=".25"/><circle cx="13" cy="58" r=".30"/>
    <circle cx="29" cy="58" r=".24"/><circle cx="41" cy="60" r=".33"/>
    <circle cx="55" cy="56" r=".27"/><circle cx="60" cy="45" r=".35"/>
    <circle cx="58" cy="35" r=".22"/><circle cx="61" cy="22" r=".29"/>
    <circle cx="12" cy="27" r=".22"/><circle cx="22" cy="28" r=".30"/>
    <circle cx="34" cy="27" r=".21"/><circle cx="47" cy="20" r=".24"/>
    <circle cx="50" cy="38" r=".32"/><circle cx="44" cy="50" r=".22"/>
    <circle cx="31" cy="51" r=".27"/><circle cx="11" cy="46" r=".20"/>
    <circle cx="27" cy="14" r=".19"/><circle cx="39" cy="38" r=".24"/>
    <circle cx="54" cy="15" r=".18"/><circle cx="35" cy="56" r=".18"/>
  </g>

  <!-- A telescope-field circle at 5% opacity: felt before it is noticed. -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#C4B48A"
          stroke-width=".32" stroke-opacity=".05"/>

  <!-- Broken, low-contrast chart lines: a loose branching path, not a glyph. -->
  <g fill="none" stroke="#C4B48A" stroke-width=".28" stroke-opacity=".07"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21 L18 16 L31 19 L43 12"/>
    <path d="M31 19 L39 31 L54 27"/>
    <path d="M18 16 L14 34 L25 45 L18 54"/>
  </g>

  <!-- Mixed-magnitude foreground stars. -->
  <g fill="#E8D5A3">
    <circle cx="18" cy="16" r="2.25"/><circle cx="39" cy="31" r="1.95"/>
    <circle cx="25" cy="45" r="1.72"/><circle cx="54" cy="27" r="1.52"/>
    <circle cx="43" cy="12" r="1.34"/><circle cx="14" cy="34" r="1.18"/>
    <circle cx="31" cy="19" r="1.03"/><circle cx="18" cy="54" r=".94"/>
    <circle cx="9" cy="21" r=".82"/><circle cx="48" cy="46" r=".76"/>
    <circle cx="34" cy="42" r=".66"/><circle cx="52" cy="16" r=".58"/>
  </g>
  <g fill="#F7F1E1">
    <circle cx="18" cy="16" r=".70"/><circle cx="39" cy="31" r=".60"/>
    <circle cx="25" cy="45" r=".50"/><circle cx="54" cy="27" r=".42"/>
    <circle cx="43" cy="12" r=".36"/><circle cx="14" cy="34" r=".31"/>
  </g>
</svg>
