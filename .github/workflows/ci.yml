name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: pure core (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./internal/...
      - run: go vet ./internal/...
      - run: go test ./internal/...

  # TODO(core): once the Collector module versions in builder-config.yaml are
  # pinned to a verified release, add a job that runs `make build` to assemble
  # the full distribution and smoke-test the binary.
