name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: pure core (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./internal/...
      - run: go vet ./internal/...
      - run: go test ./internal/...

  components:
    name: adapters (build, test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [astrienasampler, clickhouseexporter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go -C components/${{ matrix.module }} build ./...
      - run: go -C components/${{ matrix.module }} test ./...

  distro:
    name: full distribution (ocb build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make build
      - run: ./_build/astriena components
