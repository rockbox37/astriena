name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to checkout for the build (must include Dockerfile)"
        required: true
        default: "main"
      image_tag:
        description: "Container image tag to publish"
        required: true
        default: "v0.1.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: build and push container image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve refs
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHECKOUT_REF="${{ inputs.checkout_ref }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            CHECKOUT_REF="${{ github.ref_name }}"
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          echo "checkout_ref=${CHECKOUT_REF}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=${IMAGE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.semver_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
