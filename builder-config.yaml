# OpenTelemetry Collector Builder (ocb) manifest for the Astriena distribution.
#
# "A focused OpenTelemetry distribution with a sampling engine that uses a
#  fraction of the memory of the stock processor — none of the plugin bloat."
#
# Build with:  make build   (installs the builder and runs it against this file)
#
# Module versions are pinned to the OpenTelemetry Collector v0.160.0 / v1.66.0
# release line. Bump the v0.x (receiver/processor) and v1.x (core/pdata/confmap)
# groups together when upgrading.
dist:
  name: astriena
  description: A focused OpenTelemetry distribution with an efficient tail-sampling engine (BYOS to ClickHouse).
  output_path: ./_build
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0

processors:
  # Reused, hardened plumbing:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  # Astriena's own tail-sampling engine (the wedge):
  - gomod: github.com/rockbox37/astriena/components/astrienasampler v0.1.0
    path: ./components/astrienasampler

exporters:
  - gomod: github.com/rockbox37/astriena/components/clickhouseexporter v0.1.0
    path: ./components/clickhouseexporter

extensions: []

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0

# The local components depend on the repo-root module (github.com/rockbox37/astriena)
# for the pure core packages. A dependency's own `replace` is ignored by the
# generated distribution module, so the root module is replaced here (path is
# relative to the generated module in ./_build).
replaces:
  - github.com/rockbox37/astriena => ../
